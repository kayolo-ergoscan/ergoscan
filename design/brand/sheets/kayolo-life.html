<!doctype html>

<title>Кайоло — раскадровка</title>
<!--
  Storyboard for design/brand/kayolo-life.md. Kayolo is drawn by the real engine:
  pixel.js is apps/web/src/components/pixel.ts bundled as PixelKit (same as pixel.html).
  Page layouts are simplified from live shots of the site (13.11, 1771×891 and 390×844).
  Each <section class="board"> is one PNG; ?b=3 shows only board 3.
-->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=block" rel="stylesheet" />
<style>
  :root { --page:#0e0e0e; --tile:#1a1a1a; --tile2:#232323; --t2:#c6c6c6; --t3:#8f8f8f; --line:rgba(255,255,255,.08); --ring:#3ca2ff; --no:#ff5468; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #050505; color: #fff; font-family: "IBM Plex Sans", system-ui, sans-serif; }
  .board { width: 1600px; padding: 34px 40px 38px; background: var(--page); margin: 0 0 40px; position: relative; }
  .board h1 { font: 600 34px/1.15 "IBM Plex Sans"; margin: 0 0 8px; letter-spacing: -.01em; }
  .board h1 .tag { font: 600 17px "IBM Plex Mono"; color: #0e0e0e; background: #fff; border-radius: 6px; padding: 2px 9px; margin-right: 12px; vertical-align: 6px; }
  .sub { font: 400 17px/1.5 "IBM Plex Sans"; color: var(--t2); max-width: 1500px; margin: 0 0 22px; }
  .sub b, .note b, .cap2 b { color: #fff; font-weight: 600; }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--tile); border-radius: 16px; padding: 14px 16px 16px; position: relative; }
  .cap { font: 500 12px "IBM Plex Mono"; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); margin-bottom: 8px; }
  .cap2 { font: 400 15px/1.42 "IBM Plex Sans"; color: var(--t2); margin-top: 8px; }
  .ttl { font: 600 19px/1.25 "IBM Plex Sans"; margin-bottom: 4px; }
  .note { font: 400 15px/1.45 "IBM Plex Sans"; color: var(--t2); }
  .mono { font-family: "IBM Plex Mono"; }
  .stage { position: relative; overflow: hidden; border-radius: 12px; background: var(--page); }
  .pin { position: absolute; width: 30px; height: 30px; border-radius: 15px; background: #fff; color: #0e0e0e; font: 700 16px/30px "IBM Plex Mono"; text-align: center; transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(14,14,14,.85); }
  .legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 22px; margin-top: 16px; }
  .lg { display: flex; gap: 12px; align-items: flex-start; font: 400 15px/1.42 "IBM Plex Sans"; color: var(--t2); }
  .lg .n { flex: none; width: 28px; height: 28px; border-radius: 14px; background: #fff; color: #0e0e0e; font: 700 15px/28px "IBM Plex Mono"; text-align: center; }
  .lg b { color: #fff; font-weight: 600; }
  .tip { position: absolute; background: #2c2b33; color: #fff; border-radius: 10px; padding: 7px 11px; font: 500 13px/1.35 "IBM Plex Sans"; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .tip .m { color: #a3a3a3; }
  .k { display: inline-block; font: 600 13px "IBM Plex Mono"; background: #2c2b33; border-radius: 5px; padding: 1px 7px; color: #fff; }
  .yes { color: #2fd27f; font-weight: 600; }
  .no { color: var(--no); font-weight: 600; }
  .bar { height: 10px; border-radius: 5px; background: #2a2a2a; position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .vs { font: 600 13px "IBM Plex Mono"; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 5px; display: inline-block; margin-bottom: 8px; }
  .vs.before { background: #3a2226; color: #ff9aa6; }
  .vs.after { background: #173528; color: #6ee7a8; }
  body.one .board { display: none; }
  body.one .board.on { display: block; margin: 0; }
</style>

"use strict";
const { drawPixel } = PixelKit;
const el = H.el;
const INK = { block: "#ffd23c", tx: "#ff6a2b", addr: "#ff7ab8", token: "#5b8dff", box: "#2fd27f", brand: "#ff6a2b", down: "#ff5468" };
const later = [];
const root = document.getElementById("root");

/* ---------- small DOM helpers ---------- */
function abs(p, x, y, w, h, css = "", html = "") {
  const d = document.createElement("div");
  d.style.cssText = `position:absolute;left:${x}px;top:${y}px;${w != null ? `width:${w}px;` : ""}${h != null ? `height:${h}px;` : ""}${css}`;
  if (html) d.innerHTML = html;

}
const txt = (p, x, y, s, css = "") => abs(p, x, y, null, null, `white-space:nowrap;${css}`, s);
const mix = (hex, pct, base = "#1a1a1a") => `color-mix(in srgb, ${hex} ${pct}%, ${base})`;
const chip = (p, x, y, label, ink, size = 12) => txt(p, x, y, label, `padding:2px 7px;border-radius:5px;background:${mix(ink, 22)};color:${ink};font:600 ${size}px 'IBM Plex Sans'`);
const rtxt = (p, xr, y, s, css = "") => abs(p, xr, y, null, null, `white-space:nowrap;transform:translateX(-100%);${css}`, s);
const ctxt = (p, xc, y, s, css = "") => abs(p, xc, y, null, null, `white-space:nowrap;transform:translateX(-50%);${css}`, s);

function arrow(p, x1, y1, x2, y2, color = "#fff", w = 2.5, dashed = false, head = true) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const minx = Math.min(x1, x2) - 12, miny = Math.min(y1, y2) - 12;
  const W = Math.abs(x2 - x1) + 24, Hh = Math.abs(y2 - y1) + 24;
  s.setAttribute("width", W); s.setAttribute("height", Hh);
  s.style.cssText = `position:absolute;left:${minx}px;top:${miny}px;overflow:visible;pointer-events:none`;
  const a = x1 - minx, b = y1 - miny, c = x2 - minx, d = y2 - miny;
  const ang = Math.atan2(d - b, c - a), hl = 10;
  s.innerHTML = `<path d="M${a} ${b}L${c} ${d}" stroke="${color}" stroke-width="${w}" fill="none" ${dashed ? 'stroke-dasharray="6 6"' : ""} stroke-linecap="round"/>` +
    (head ? `<path d="M${c} ${d}L${c - hl * Math.cos(ang - 0.45)} ${d - hl * Math.sin(ang - 0.45)}M${c} ${d}L${c - hl * Math.cos(ang + 0.45)} ${d - hl * Math.sin(ang + 0.45)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" fill="none"/>` : "");
  p.append(s);

}
function curve(p, pts, color = "#fff", w = 2.5, dashed = true) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", 10); s.setAttribute("height", 10);
  s.style.cssText = "position:absolute;left:0;top:0;overflow:visible;pointer-events:none";
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) d += ` L${pts[i][0]} ${pts[i][1]}`;
  s.innerHTML = `<path d="${d}" stroke="${color}" stroke-width="${w}" fill="none" ${dashed ? 'stroke-dasharray="7 7"' : ""} stroke-linecap="round" stroke-linejoin="round"/>`;
  p.append(s);
}
function cursor(p, x, y, sc = 1) {
  return abs(p, x, y, 18 * sc, 26 * sc, "", `<svg width="${18 * sc}" height="${26 * sc}" viewBox="0 0 18 26"><path d="M1 1 L1 21 L6 16 L9.5 24 L13 22.5 L9.6 15 L16 15 Z" fill="#fff" stroke="#0e0e0e" stroke-width="1.6" stroke-linejoin="round"/></svg>`);
}
function tipBox(p, x, y, html) { const d = abs(p, x, y, null, null, ""); d.className = "tip"; d.innerHTML = html; return d; }

/* ---------- Kayolo by the real engine ---------- */
// o: x,y ground point in host px; s scale (1 = 26 px body); ink|color; mood; before; face; pose; hopAt; at; walk (px/s); ghost (opacity); from
function K(host, o) {
  const s = o.s ?? 1;
  const W = Math.ceil(70 * s) + 8, Hh = Math.ceil(92 * s) + 8, gy = Hh - Math.ceil(6 * s) - 2;
  const dpr = o.dpr ?? 3;
  const mood = o.mood ?? "idle";
  const before = o.before ?? mood;
  const at = o.at ?? (o.hopAt != null ? 1200 + o.hopAt : 2600);
  const base = o.from ?? 10000;
  // Each (canvas, id) has its own seeded blinks; try a few seeds and keep the frame
  // with the most eye ink, so a still never catches him mid-blink by accident.
  const run = (from) => {
    const c = document.createElement("canvas");
    c.width = W * dpr; c.height = Hh * dpr;
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    for (let t = 0; t <= at; t += 16) {
      ctx.clearRect(0, 0, W, Hh);
      const pose = { ...(o.pose || {}) };
      if (o.walk) pose.roll = (t / 1000) * o.walk;
      drawPixel(ctx, { x: W / 2, y: gy, scale: s, color: o.color ?? INK[o.ink ?? "tx"], mood: t < 1200 ? before : mood, now: from + t, face: o.face ?? -1, id: o.id ?? "kayolo", ...pose });
    }
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    let ink = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200 && d[i] < 40 && d[i + 1] < 40 && d[i + 2] < 40) ink++;
    return { c, ink };
  };
  let best = null;
  for (const k of [0, 3100, 7300, 12700, 19900]) {
    const r = run(base + k);
    if (!best || r.ink > best.ink * 1.04) best = r;
  }
  const c = best.c;
  c.style.cssText = `position:absolute;left:${o.x - W / 2}px;top:${o.y - gy}px;width:${W}px;height:${Hh}px;pointer-events:none;${o.ghost ? `opacity:${o.ghost};` : ""}`;
  host.append(c);
  return c;
}
const grain = (p, x, y, s, ink) => abs(p, x - 4 * s, y - 8 * s, 8 * s, 8 * s, `background:${INK[ink] ?? ink}`);

/* ---------- framing ---------- */
function scaled(node, W, Hh, sc, extra = "") {
  const o = el("div", { style: { width: W * sc + "px", height: Hh * sc + "px", position: "relative", overflow: "hidden", borderRadius: "12px" } });
  node.style.position = "absolute"; node.style.left = "0"; node.style.top = "0";
  node.style.transform = `scale(${sc})`; node.style.transformOrigin = "0 0";
  o.append(node);
  if (extra) o.style.cssText += extra;
  return o;
}
function crop(node, x0, y0, w, h, sc) {
  const o = el("div", { style: { width: w * sc + "px", height: h * sc + "px", position: "relative", overflow: "hidden", borderRadius: "12px" } });
  node.style.position = "absolute"; node.style.left = "0"; node.style.top = "0";
  node.style.transform = `scale(${sc}) translate(${-x0}px, ${-y0}px)`; node.style.transformOrigin = "0 0";
  o.append(node);
  return o;
}
