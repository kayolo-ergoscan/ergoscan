<!doctype html>
<html>
<head><meta charset="utf-8" /><title>enc</title></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
// Frames arrive from rec.mjs as [seconds, base64 jpeg]; encode() replays them in real time into a canvas
// and records that canvas with MediaRecorder. Returns the video as base64.
window.__f = [];
const toBitmap = async (b64) => {
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return createImageBitmap(new Blob([u], { type: "image/jpeg" }));
};
window.encode = async (mime, w, h) => {
  const c = document.getElementById("c");
  c.width = w;
  c.height = h;
  const ctx = c.getContext("2d");
  const first = await toBitmap(window.__f[0][1]);
  ctx.drawImage(first, 0, 0, w, h);
  first.close();
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const parts = [];
  rec.ondataavailable = (e) => e.data.size && parts.push(e.data);
  const done = new Promise((r) => (rec.onstop = r));
  rec.start(250);
  const t0 = performance.now();
  const s0 = window.__f[0][0];
  for (let i = 1; i < window.__f.length; i++) {
    const next = toBitmap(window.__f[i][1]);
    const at = t0 + (window.__f[i][0] - s0) * 1000;
    const bmp = await next;
    const wait = at - performance.now();
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    ctx.drawImage(bmp, 0, 0, w, h);
    bmp.close();
  }
  await new Promise((r) => setTimeout(r, 500));
  rec.stop();
  await done;
  const buf = new Uint8Array(await new Blob(parts, { type: mime }).arrayBuffer());
  let s = "";
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
};
</script>
</body>
</html>
